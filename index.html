<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#101010">
<title>Brad's Songbook</title>
<style>
  :root { color-scheme: dark; --bg:#101010; --panel:#191919; --text:#f7f7f7; --muted:#a8a8a8; --line:#303030; --accent:#e6c98a; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
  main { width:min(100%, 760px); margin:0 auto; padding:34px 22px 48px; }
  header { text-align:center; padding:18px 0 24px; }
  .eyebrow { font-size:.75rem; letter-spacing:.18em; text-transform:uppercase; color:var(--accent); }
  h1 { margin:10px 0 8px; font-size:clamp(2rem, 8vw, 3.2rem); font-weight:650; letter-spacing:-.045em; }
  .intro { color:var(--muted); margin:0; font-size:1rem; }
  .search-wrap { position:sticky; top:0; padding:12px 0 14px; background:linear-gradient(var(--bg) 80%, transparent); z-index:2; }
  .search { width:100%; border:1px solid #414141; background:var(--panel); color:var(--text); border-radius:14px; padding:16px 17px; font:inherit; font-size:1rem; outline:none; }
  .search:focus { border-color:var(--accent); box-shadow:0 0 0 3px #e6c98a22; }
  .meta { display:flex; justify-content:space-between; gap:12px; color:var(--muted); font-size:.85rem; margin:5px 2px 12px; }
  .song { display:flex; align-items:center; justify-content:space-between; gap:16px; padding:17px 3px; border-bottom:1px solid var(--line); }
  .song-title { font-size:1.05rem; font-weight:570; line-height:1.35; }
  .artist { color:var(--muted); margin-top:4px; font-size:.93rem; line-height:1.35; }
  .letter { color:var(--accent); font-size:.72rem; letter-spacing:.12em; text-transform:uppercase; min-width:22px; text-align:right; }
  .empty { text-align:center; color:var(--muted); padding:36px 10px; }
  footer { text-align:center; color:var(--muted); font-size:.88rem; padding:30px 8px 0; }
  footer strong { display:block; color:var(--text); font-weight:550; margin-bottom:5px; }
</style>
</head>
<body>
<main>
  <header>
    <div class="eyebrow">Live Music</div>
    <h1>Brad's Songbook</h1>
    <p class="intro">Browse the songs I play.</p>
  </header>
  <div class="search-wrap">
    <input id="search" class="search" type="search" placeholder="Search songs or artists…" aria-label="Search songs or artists" autocomplete="off">
  </div>
  <div class="meta"><span id="count">8 songs</span><span>Song list</span></div>
  <section id="songs" aria-live="polite"></section>
  <footer><strong>Find a favorite?</strong>Just let me know and I'll see if I can play it.</footer>
</main>
<script>
const songs = [
  { title: "Another Saturday Night", artist: "Yusuf / Cat Stevens" },
  { title: "Crash into Me", artist: "Dave Matthews Band" },
  { title: "I Want to Hold Your Hand", artist: "The Beatles" },
  { title: "Just the Way You Are", artist: "Bruno Mars" },
  { title: "Lover, Lover", artist: "Jerrod Niemann" },
  { title: "The Man Who Can't Be Moved", artist: "The Script" },
  { title: "Say", artist: "John Mayer" },
  { title: "Something", artist: "The Beatles" }
];
const search = document.getElementById('search');
const list = document.getElementById('songs');
const count = document.getElementById('count');
function render() {
  const q = search.value.trim().toLocaleLowerCase();
  const filtered = songs.filter(s => (s.title + " " + s.artist).toLocaleLowerCase().includes(q));
  count.textContent = `${filtered.length} ${filtered.length === 1 ? 'song' : 'songs'}`;
  list.replaceChildren();
  if (!filtered.length) {
    const empty = document.createElement('div');
    empty.className = 'empty';
    empty.textContent = 'No matches. Try another song or artist.';
    list.append(empty);
    return;
  }
  filtered.forEach(s => {
    const row = document.createElement('article');
    row.className = 'song';
    const info = document.createElement('div');
    const title = document.createElement('div');
    title.className = 'song-title';
    title.textContent = s.title;
    const artist = document.createElement('div');
    artist.className = 'artist';
    artist.textContent = s.artist;
    info.append(title, artist);
    const mark = document.createElement('span');
    mark.className = 'letter';
    mark.textContent = s.title.charAt(0);
    row.append(info, mark);
    list.append(row);
  });
}
search.addEventListener('input', render);
render();
</script>
</body>
</html>
